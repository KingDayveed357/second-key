openapi: 3.1.0
info:
  title: Second Key API
  version: 0.4.0
  description: |
    Second Key sits between a payment decision and PayPal. A person confirms an
    intent (what an agent may buy, or exactly whom to pay and how much); your app
    or agent submits the payment; Second Key screens it, has PayPal authorize it
    (sandbox only), and decides CAPTURE, HOLD, VOID or REJECT. A held payment is
    released only by the right person: the payer for their own agent's purchase,
    their trusted contact for a transfer their rule paused (ADR-0020).

    There is deliberately no capture or void endpoint: money moves only in the
    isolated executor, by consuming a single-use approval (docs/architecture.md).
    AP2 delegated verification lives under /v2 (ADR-0023).

    Auth: Bearer API keys (wk_...), one role per key (see securitySchemes).
    Errors: RFC 9457 problem documents with a trace_id. Request bodies are strict:
    unknown fields are refused. Formerly named Witness; package names keep that name.
  license:
    name: MIT
servers:
  - url: http://localhost:4000/v1
    description: Local stack against the PayPal sandbox (the hosted demo's API is private; its website proxies only the demo routes)
security:
  - apiKey: []
tags:
  - name: intents
    description: What the person authorized. Shopping (category, budget, retailers, hard rules) or transfer (exact payee and amount, plus the payer's own review rule).
  - name: purchases
    description: Payments submitted against a confirmed intent, and what PayPal recorded for them.
  - name: holds
    description: Reviewing a held payment. The reviewer is decided when the hold is created; the payer can always cancel.
  - name: protection
    description: The payer's standing protection (ADR-0020), review threshold and trusted contact. Tightening applies at once; loosening waits 48 h.
  - name: webhooks
  - name: verify
    description: Public re-verification of the hash-chained audit log.
  - name: console
    description: Read-only operator views (ops role), plus dispute handling.
  - name: demo
    description: Demo-only routes used by the hosted website. Not part of an integration.
  - name: ap2
    description: AP2 delegated verification, settlement binding and receipts (ADR-0023). These live under /v2 and the site root, not /v1.
paths:
  /intents:
    post:
      tags: [intents]
      summary: Create a DRAFT intent, from a structured policy or from free text (Claude drafts; the person confirms every field)
      security: [{ apiKey: [shopper] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                policy:
                  oneOf:
                    - { $ref: "#/components/schemas/PolicyV1" }
                    - { $ref: "#/components/schemas/TransferPolicyV1" }
                source_text: { type: string, maxLength: 1000, description: "The person's own words, kept with the intent" }
                text: { type: string, minLength: 3, maxLength: 1000, description: "Free text instead of a policy; returns a draft with ambiguities to resolve" }
      responses:
        "201":
          description: Draft intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intent" }
        "422": { $ref: "#/components/responses/Problem" }
  /intents/{intentId}:
    get:
      tags: [intents]
      security: [{ apiKey: [shopper] }, { apiKey: [ops] }]
      parameters: [{ $ref: "#/components/parameters/intentId" }]
      responses:
        "200":
          description: Intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intent" }
        "404": { $ref: "#/components/responses/Problem" }
  /intents/{intentId}/confirm:
    post:
      tags: [intents]
      summary: Freeze the policy (answers to ambiguities included) as CONFIRMED vN
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/intentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                policy:
                  description: "Optional: the reviewed policy, when the person changed the draft or resolved its ambiguities. Send {} to confirm the draft as it is."
                  oneOf:
                    - { $ref: "#/components/schemas/PolicyV1" }
                    - { $ref: "#/components/schemas/TransferPolicyV1" }
      responses:
        "200":
          description: Confirmed intent with digest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intent" }
        "409": { $ref: "#/components/responses/Problem" }
  /intents/{intentId}/revoke:
    post:
      tags: [intents]
      summary: Revoke; open HOLDs on this intent are voided
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/intentId" }]
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intent" }
  /purchases:
    post:
      tags: [purchases]
      summary: Submit a payment against a confirmed intent (an agent's cart, or a transfer)
      description: |
        Second Key re-fetches product facts by canonical ID and never uses the agent's
        description. Violations are REJECTED before any PayPal call. Otherwise the
        order is created from the verified cart and authorized against the payer's
        saved wallet, then verified against PayPal's stored order. Poll
        GET /purchases/{purchaseId} for the final state (no outbound webhooks yet).
      security: [{ apiKey: [agent:purchase] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{8,128}$" }
          description: "Same key and body returns the original result (200); same key, different body is 422. Kept for good, per tenant."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/PurchaseRequest" }
                - { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "202":
          description: Accepted; state reflects the decision so far
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseStatus" }
        "200":
          description: Idempotent replay of an earlier identical request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseStatus" }
        "403": { $ref: "#/components/responses/Problem" }
        "422":
          description: Malformed cart, or Idempotency-Key reused with a different body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /purchases/{purchaseId}:
    get:
      tags: [purchases]
      summary: Purchase status (agents see status and reasons only)
      security: [{ apiKey: [agent:purchase] }, { apiKey: [shopper] }, { apiKey: [ops] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseStatus" }
  /purchases/{purchaseId}/evidence:
    get:
      tags: [purchases]
      summary: Checks, facts snapshot, PayPal IDs and chain proof
      security: [{ apiKey: [shopper] }, { apiKey: [ops] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200":
          description: Evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
  /purchases/{purchaseId}/paypal:
    get:
      tags: [purchases]
      summary: Live read-only proxy of PayPal's own order, authorization and capture status
      security: [{ apiKey: [shopper] }, { apiKey: [ops] }, { apiKey: [demo] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200":
          description: PayPal state as fetched now (with debug IDs)
          content:
            application/json:
              schema:
                type: object
                properties:
                  fetched_at: { type: string, format: date-time }
                  order: { type: object }
                  authorization: { type: object }
                  capture: { type: object }
  /holds/{purchaseId}/approve:
    post:
      tags: [holds]
      summary: The reviewer approves a held payment (PayPal's order is re-checked first)
      security: []
      description: "The reviewer's single-use credential goes in the body (never in a URL). It expires after 30 minutes, is replaced by a reminder, and locks after 10 wrong attempts. Only the assigned trusted contact can approve a guardian hold; the payer and admins get 403."
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: "Approval recorded after PayPal's order was re-checked (state CAPTURE_APPROVED, or VOIDING if it no longer matches). The executor captures; this call never does. replayed=true when the same decision was already recorded."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "Not this hold's reviewer (for example the payer approving a guardian hold), or the credential doesn't match" }
        "409": { description: "The hold was already decided differently" }
        "410": { description: "Credential expired, replaced or locked" }
        "502": { description: "PayPal couldn't be reached to re-check the order; nothing changed" }
  /holds/{purchaseId}/deny:
    post:
      tags: [holds]
      security: []
      description: "The reviewer's single-use credential goes in the body (never in a URL). It expires after 30 minutes, is replaced by a reminder, and locks after 10 wrong attempts. Only the assigned trusted contact can approve a guardian hold; the payer and admins get 403."
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: "Denial recorded (state VOIDING; VOIDED only after PayPal confirms). replayed=true when the same decision was already recorded."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "Token doesn't match this purchase's current link" }
        "409": { description: "The hold was already decided differently" }
        "410": { description: "Link expired, or no link was issued" }
  /webhooks/paypal:
    post:
      tags: [webhooks]
      summary: PayPal webhook intake (signature verified with PayPal, then deduped and re-fetched)
      security: []
      responses:
        "200": { description: Stored (or duplicate) }
        "400": { description: Signature verification failed }
  /verify/purchases/{purchaseId}:
    get:
      tags: [verify]
      summary: Recompute the hash chain for one purchase
      security: []
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChainProof" }
  /verify/chain:
    get:
      tags: [verify]
      summary: Recompute the full chain for the current epoch; returns the head hash
      security: []
      responses:
        "200":
          description: Chain head and validity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChainProof" }
  /intents/{intentId}/summary:
    get:
      tags: [intents]
      summary: What the shopper confirmed (read-only view for agents)
      security: [{ apiKey: [agent:purchase] }, { apiKey: [shopper] }, { apiKey: [ops] }]
      parameters: [{ $ref: "#/components/parameters/intentId" }]
      responses:
        "200": { description: "id, status, source_text, policy" }
        "404": { $ref: "#/components/responses/Problem" }
  /purchases/{purchaseId}/hold-link:
    post:
      tags: [holds]
      summary: Issue a one-time review credential for a hold the payer decides themselves (their own agent's purchase)
      description: "Shown once; only its hash is stored. The returned path carries it in the URL fragment (/holds/{id}#k=...), which browsers never send to a server. Refused with 409 for holds that wait for the trusted contact: their credential goes only to their own channel (ADR-0020)."
      security: [{ apiKey: [shopper] }, { apiKey: [admin] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: "path, token, expires_at (default 30 min, capped at the hold's auto_void_at)" }
        "409": { $ref: "#/components/responses/Problem" }
  /holds/{purchaseId}:
    get:
      tags: [holds]
      summary: View a held purchase (signed in). With a credential instead, use POST /holds/{purchaseId}/view.
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: "purchase_id, state, reasons, amount, items, retailer, auto_void_at (when the held money is released automatically), resolution, link_expires_at (when this link stops working; null when signed in)" }
        "401": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
  /me/purchases:
    get:
      tags: [purchases]
      summary: The signed-in shopper's receipts (purchases on their own intents, with hold deadlines)
      security: [{ apiKey: [shopper] }]
      responses:
        "200": { description: "{ purchases: [...] }" }
  /purchases/{purchaseId}/dispute-evidence/draft:
    post:
      tags: [console]
      summary: Draft dispute evidence from the record (never sent to PayPal from here)
      security: [{ apiKey: [ops] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: "text, source (ai | template), values" }
        "409": { $ref: "#/components/responses/Problem" }
  /console/purchases:
    get:
      tags: [console]
      summary: Ledger rows for the tenant, newest first, with the primary (first non-passing) check
      security: [{ apiKey: [ops] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200": { description: "{ purchases: [{ id, state, outcome, product, retailer, amount_cents, currency, primary_check, reasons, intent_id, paypal_order_id, paypal_capture_id, created_at, updated_at }] }" }
  /console/purchases/{purchaseId}/checks:
    get:
      tags: [console]
      summary: Every check for one purchase, in order (evidence-chain widget)
      security: [{ apiKey: [ops] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: "{ checks: [{ phase, check_id, kind, result, detail, line, model, prompt_version, created_at }] }" }
        "404": { $ref: "#/components/responses/Problem" }
  /console/holds:
    get:
      tags: [console]
      summary: Unresolved HOLDs, soonest auto-void first
      security: [{ apiKey: [ops] }]
      responses:
        "200": { description: "{ holds: [{ id, product, retailer, amount_cents, currency, reasons, created_at, auto_void_at, shopper_notified }] }" }
  /console/stats:
    get:
      tags: [console]
      summary: Counts and values by state, blocked value by reason, and captures without a consumed approval (should be 0)
      security: [{ apiKey: [ops] }]
      responses:
        "200": { description: "{ purchases, captured, rejected, voided, held, blocked_by_reason, unauthorized_captures, by_state }" }
  /console/webhooks:
    get:
      tags: [console]
      summary: Recent PayPal webhook deliveries (no payloads)
      security: [{ apiKey: [ops] }]
      responses:
        "200": { description: "{ configured, events }" }
  /console/disputes:
    get:
      tags: [console]
      summary: Disputes attached to this tenant's purchases (ADR-0010)
      security: [{ apiKey: [ops] }]
      responses:
        "200": { description: "{ disputes: [...] }" }
    post:
      tags: [console]
      summary: Attach a buyer-opened PayPal dispute; refused unless it is against one of this tenant's captures
      security: [{ apiKey: [ops] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [dispute_id], properties: { dispute_id: { type: string } } }
      responses:
        "201": { description: Attached }
        "422": { $ref: "#/components/responses/Problem" }
  /console/disputes/{disputeId}/refresh:
    post:
      tags: [console]
      summary: Re-read the dispute from PayPal
      security: [{ apiKey: [ops] }]
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Dispute }
  /console/disputes/{disputeId}/submit:
    post:
      tags: [console]
      summary: Submit reviewer-approved evidence text, exactly as approved, at most once
      security: [{ apiKey: [ops] }]
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, minLength: 50, maxLength: 5000 } } }
      responses:
        "200": { description: Submitted }
        "409": { $ref: "#/components/responses/Problem" }
  /console/disputes/{disputeId}/sandbox-step:
    post:
      tags: [console]
      summary: "Sandbox only: require-evidence, or adjudicate in the seller's favour after evidence (recorded as a simulated verdict)"
      security: [{ apiKey: [ops] }]
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ step, dispute }" }
        "409": { $ref: "#/components/responses/Problem" }
  /demo/scenarios:
    get:
      tags: [demo]
      summary: List the judge scenarios
      security: []
      responses:
        "200": { description: "[{ name, title, expected }]" }
  /demo/scenarios/{name}:
    post:
      tags: [demo]
      summary: Run a named judge scenario through the public purchase path (real sandbox)
      security: [{ apiKey: [demo] }]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [normal, reject, over_budget, hold, overpriced, injection, cart_swap] }
      responses:
        "202": { description: "{ scenario, expected, intent_id, purchase }" }
        "404": { $ref: "#/components/responses/Problem" }
  /demo/stats:
    get:
      tags: [demo]
      summary: Aggregate counters for the judge page, counted from the current audit epoch (no ids)
      security: [{ apiKey: [demo] }]
      responses:
        "200": { description: "{ purchases, captured, rejected, voided, held, blocked_by_reason, unauthorized_captures, since? }" }
  /demo/screen:
    post:
      tags: [demo]
      summary: "Try to beat it: screen a judge-written listing against the demo policy. No purchase, order or PayPal call."
      security: [{ apiKey: [demo] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, price]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                brand: { type: string, maxLength: 80 }
                category: { type: string, maxLength: 120 }
                color: { type: string, maxLength: 40 }
                size: { type: string, maxLength: 20 }
                price: { type: number, exclusiveMinimum: 0, maximum: 100000 }
                attributes: { type: object, additionalProperties: { type: string, maxLength: 200 }, maxProperties: 10 }
      responses:
        "200": { description: "{ outcome: CAPTURE | HOLD | REJECT, would_reach_paypal, checks, policy, ai_ms }" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /demo/reset:
    post:
      tags: [demo]
      summary: Release every held authorization (voided by the executor) and start a new audit epoch; deletes nothing
      security: [{ apiKey: [admin] }]
      responses:
        "202": { description: "{ epoch, holds_released }" }
  /verifications:
    post:
      tags: [ap2]
      servers:
        - url: https://witness-api.onrender.com/v2
        - url: http://localhost:4000/v2
      summary: Verify presented AP2 checkout (and payment) mandate chains; evaluate every constraint against the global ledger; sign Mandate Receipts
      description: |
        Decision CONFORMS | NONCONFORMING | CANNOT_CONFIRM | COSIGN_REQUIRED, with the spec's receipt errors
        (invalid_credential, invalid_mandate, unresolved_constraint). aud and nonce are required. The caller sends
        the issuer and merchant keys it trusts; receipts record their thumbprints. A conforming verification with a
        payment mandate can be settled within 15 minutes.
      security: [{ apiKey: [ap2:verify] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkout, trust]
              properties:
                checkout: { type: object, required: [mandate, aud, nonce], properties: { mandate: { type: string, description: "~~-joined SD-JWT chain" }, aud: { type: string }, nonce: { type: string, minLength: 8 } } }
                payment: { type: object, required: [mandate, aud, nonce], properties: { mandate: { type: string }, aud: { type: string }, nonce: { type: string }, cosignatures: { type: array, maxItems: 5, items: { type: string } } } }
                trust: { type: object, required: [issuers], properties: { issuers: { type: object, description: "JWKS of EC P-256 public keys" }, merchants: { type: object } } }
      responses:
        "201": { description: "{ verification_id, decision, error?, findings, constraints, checkout_hash, facts_attestation, cosign, settleable, merchant_signature, ledger, receipts: { checkout, payment, kid, jwks_uri }, trusted_keys }" }
        "200": { description: Replay of the stored answer for the same Idempotency-Key and body }
        "422": { $ref: "#/components/responses/Problem" }
  /verifications/{verificationId}:
    get:
      tags: [ap2]
      servers:
        - url: https://witness-api.onrender.com/v2
        - url: http://localhost:4000/v2
      security: [{ apiKey: [ap2:verify] }]
      parameters: [{ name: verificationId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The stored verification response }
        "404": { $ref: "#/components/responses/Problem" }
  /settlements:
    post:
      tags: [ap2]
      servers:
        - url: https://witness-api.onrender.com/v2
        - url: http://localhost:4000/v2
      summary: Bind a CONFORMS verification to one PayPal order; the executor re-checks it and captures, or voids a mismatch
      security: [{ apiKey: [ap2:verify] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verification_id, psp, order_id]
              properties:
                verification_id: { type: string }
                psp: { type: string, enum: [paypal] }
                order_id: { type: string }
      responses:
        "202": { description: "{ settlement_id, state: MATCHED | VOIDING | REFUSED, diffs, amount, ... }" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /settlements/{settlementId}:
    get:
      tags: [ap2]
      servers:
        - url: https://witness-api.onrender.com/v2
        - url: http://localhost:4000/v2
      summary: Settlement state; in final states, AP2 Checkout and Payment Receipts (signed JWTs)
      security: [{ apiKey: [ap2:verify] }]
      parameters: [{ name: settlementId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ settlement_id, state, order_id, authorization_id, capture_id, diffs, receipts: { checkout, payment } | null }" }
        "404": { $ref: "#/components/responses/Problem" }
  /.well-known/jwks.json:
    get:
      tags: [ap2]
      servers:
        - url: https://witness-api.onrender.com
        - url: http://localhost:4000
      summary: The public keys that verify every receipt and facts attestation
      security: []
      responses:
        "200": { description: "JWKS (EC P-256, ES256, kid-addressed)" }
  /demo/ap2/test-verification:
    post:
      tags: [ap2, demo]
      summary: 'Run a test verification: no account, no key; stores nothing; PayPal is not called'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [open_checkout, open_payment, jwk]
              properties:
                open_checkout: { type: string }
                open_payment: { type: string }
                jwk: { type: object, description: The public key that signed them }
                product: { type: string, enum: [TRL-GRY-10, TRL-WHT-10, TRL-BLK-10, TRL-PRO-10] }
      responses:
        "200": { description: "{ decision, constraints, findings, receipts, facts_attestation, presented, jwks_uri }" }
        "422": { $ref: "#/components/responses/Problem" }
  /demo/ap2/incidents:
    get:
      tags: [ap2, demo]
      summary: "AP2 verifications in the current demo session, for the Protection Desk (read-only)"
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 300 } }
      responses:
        "200": { description: "{ verifications: [{ id, created_at, decision, kind, run, product, caught_by, layers: { signatures, ap2, facts, ledger, paypal }, reasons, receipts, settlement }] }" }
  /console/ap2:
    get:
      tags: [ap2, console]
      summary: AP2 verifications for operators, layer by layer (read-only)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 300 } }
        - { name: scope, in: query, schema: { type: string, enum: [session] } }
      responses:
        "200": { description: Same rows as /demo/ap2/incidents }
  /me/demo/ap2/shop/plan:
    post:
      tags: [ap2, demo]
      summary: "Real-product demo: draft the search, rules and budget from the shopper's words (Claude Haiku; patterns without a model)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [need], properties: { need: { type: string, minLength: 3, maxLength: 300 } } }
      responses:
        "200": { description: "{ plan: { query, max_cents, rules: [{ attribute, any_of, none_of }] }, summary, drafted_by: ai | rules }" }
  /me/demo/ap2/shop/search:
    post:
      tags: [ap2, demo]
      summary: "Real-product demo: Channel3 search within budget, with what each listing's own data says about each rule"
      responses:
        "200": { description: "{ source: channel3, hits: [{ id, title, brand, image, price_cents, retailer, attributes, rules }] }" }
        "502": { $ref: "#/components/responses/Problem" }
  /me/demo/ap2/shop/runs:
    post:
      tags: [ap2, demo]
      summary: "Real-product demo: the agent closes Rose's signed mandates for a Channel3 product; Second Key re-fetches it, verifies and settles on the PayPal sandbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, product_id, open_checkout, open_payment]
              properties:
                mode: { type: string, enum: [buy, swap, hide_list] }
                product_id: { type: string, description: Channel3 product id }
                swap_to: { type: string, description: "swap: the product the order sent to PayPal holds instead" }
                open_checkout: { type: string }
                open_payment: { type: string }
      responses:
        "201": { description: "{ mode, agent, verification, settlement, caught_by }" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /holds/{purchaseId}/view:
    post:
      tags: [holds]
      summary: View a held payment with the reviewer's credential
      security: []
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: "purchase_id, state, reasons, amount, payee or items, the quoted evidence, auto_void_at, and who may approve" }
        "401": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
  /me/protection:
    get:
      tags: [protection]
      summary: The payer's standing protection (threshold, trusted contact, pending changes)
      security: [{ apiKey: [shopper] }]
      responses:
        "200": { description: "threshold_cents, guardian, pending changes with apply_at" }
  /me/protection/threshold:
    post:
      tags: [protection]
      summary: Set the review threshold (lowering or setting one applies now; raising or removing it waits 48 h and the trusted contact is told)
      security: [{ apiKey: [shopper] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [threshold_cents], properties: { threshold_cents: { type: [integer, "null"], minimum: 0, maximum: 10000000 } } }
      responses:
        "200": { description: The updated protection }
        "422": { $ref: "#/components/responses/Problem" }
  /me/guardians:
    post:
      tags: [protection]
      summary: Invite a trusted contact (they accept through their own channel)
      security: [{ apiKey: [shopper] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [display_name, address], properties: { display_name: { type: string, minLength: 1, maxLength: 40 }, address: { type: string, description: "Their channel address (in the demo, an inbox like SK-ABCD-EFGH)" } } }
      responses:
        "200": { description: The updated protection }
        "422": { $ref: "#/components/responses/Problem" }
  /me/protection/guardian:
    post:
      tags: [protection]
      summary: Make an accepted contact the trusted contact (the first one applies now; replacing one waits 48 h)
      security: [{ apiKey: [shopper] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [guardian_id], properties: { guardian_id: { type: string } } }
      responses:
        "200": { description: The updated protection }
  /me/protection/guardian/remove:
    post:
      tags: [protection]
      summary: Remove the trusted contact (waits 48 h; held payments stay held)
      security: [{ apiKey: [shopper] }]
      responses:
        "200": { description: The updated protection }
  /me/protection/guardian/revoke:
    post:
      tags: [protection]
      summary: Emergency revocation (immediate, needs a reason; re-granting authority is still delayed)
      security: [{ apiKey: [shopper] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 200 } } }
      responses:
        "200": { description: The updated protection }
  /me/protection/changes/{changeId}/cancel:
    post:
      tags: [protection]
      summary: Cancel a pending (delayed) change
      security: [{ apiKey: [shopper] }]
      parameters: [{ name: changeId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The updated protection }
  /me/holds/{purchaseId}/cancel:
    post:
      tags: [holds]
      summary: The payer cancels their own held payment (the authorization is voided)
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: The hold, now resolved }
  /me/holds/{purchaseId}/notify:
    post:
      tags: [holds]
      summary: Remind the trusted contact (a new credential goes to their channel; the old one stops working)
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: Reminder queued }
  /me/purchases/{purchaseId}/context:
    post:
      tags: [purchases]
      summary: The payer shares the conversation after a pause (screened for pressure; it can only keep the hold, never release it)
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: The evidence found, with quotes checked against the shared text }
  /holds/{purchaseId}/verification:
    get:
      tags: [holds]
      summary: PayPal's own record of a held payment, read live (signed in), so a reviewer can check it without trusting Second Key
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      responses:
        "200": { description: "PayPal's order, authorization and capture as PayPal reports them now" }
        "409": { $ref: "#/components/responses/Problem" }
    post:
      tags: [holds]
      summary: The same, with the reviewer's credential in the body
      security: []
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: "PayPal's order, authorization and capture as PayPal reports them now" }
        "401": { $ref: "#/components/responses/Problem" }
  /me/purchases/{purchaseId}/feedback:
    post:
      tags: [purchases]
      summary: The payer says a finding is wrong (recorded and shown to reviewers; it doesn't change the rules)
      security: [{ apiKey: [shopper] }]
      parameters: [{ $ref: "#/components/parameters/purchaseId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quote, note], properties: { quote: { type: string, minLength: 1, maxLength: 300 }, note: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        "200": { description: Recorded }
  /admin/payee-history:
    post:
      tags: [protection]
      summary: Import a payee the payer is known to have paid (audited; admin only)
      security: [{ apiKey: [admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [shopper_id, payee_id], properties: { shopper_id: { type: string }, payee_id: { type: string }, email: { type: string, format: email } } }
      responses:
        "200": { description: "{ imported: true }" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        Second Key API key (wk_ followed by 32 characters), one tenant and one role per key, stored only as a SHA-256 hash.
        Roles: shopper (one person's intents, protection and purchases), agent:purchase (submit and read its own purchases),
        ap2:verify (/v2), ops (read-only tenant views, disputes), admin (all of the above, audited imports), demo (the hosted website only).
        Keep keys server-side.
  parameters:
    intentId: { name: intentId, in: path, required: true, schema: { type: string } }
    purchaseId: { name: purchaseId, in: path, required: true, schema: { type: string } }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }
    PolicyV1:
      type: object
      additionalProperties: false
      required: [version, retailers, max_total_cents, currency, quantity, substitution, expires_at]
      properties:
        version: { const: 1 }
        products: { type: array, items: { type: string }, description: "Allowed canonical Channel3 product IDs" }
        category: { type: string }
        retailers: { type: array, minItems: 1, items: { type: string }, description: "Allowed retailer domains" }
        max_total_cents: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        hard:
          type: object
          additionalProperties: false
          properties:
            excluded_colors: { type: array, items: { type: string } }
            size: { type: string }
            brand: { type: string }
        soft:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
        substitution: { type: string, enum: [deny, hold, same_category_under_max] }
        expires_at: { type: string, format: date-time }
        max_purchases: { type: integer, minimum: 1, default: 1 }
        on_ambiguity: { type: string, enum: [hold], default: hold }
    Intent:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, CONFIRMED, REVOKED, EXPIRED] }
        source_text: { type: string }
        policy: { $ref: "#/components/schemas/PolicyV1" }
        policy_digest: { type: string, description: "sha256 of RFC 8785 canonical JSON" }
        ambiguities:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              question: { type: string }
              options: { type: array, items: { type: string } }
        confirmed_at: { type: string, format: date-time }
    PurchaseRequest:
      type: object
      additionalProperties: false
      required: [intent_id, retailer, lines]
      properties:
        intent_id: { type: string }
        retailer: { type: string, description: "Retailer domain the agent chose" }
        lines:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [product_id, quantity]
            properties:
              product_id: { type: string, description: "Canonical Channel3 product ID" }
              variant: { type: object, additionalProperties: { type: string } }
              quantity: { type: integer, minimum: 1, maximum: 99 }
        agent_note: { type: string, maxLength: 500, description: "Free text; treated as untrusted and never used for decisions" }
        conversation:
          type: object
          additionalProperties: false
          required: [lines]
          description: "Second Key (sprint prototype): the untrusted conversation the payer was in. Screened for manipulation; it can only hold the payment for review (check ai.manipulation), never approve it."
          properties:
            context: { type: string, maxLength: 500 }
            lines:
              type: array
              minItems: 1
              maxItems: 60
              items:
                type: object
                additionalProperties: false
                required: [speaker, text]
                properties:
                  speaker: { type: string, minLength: 1, maxLength: 80 }
                  text: { type: string, minLength: 1, maxLength: 1000 }
    TransferPolicyV1:
      type: object
      additionalProperties: false
      required: [version, kind, payee, amount_cents, currency, expires_at]
      properties:
        version: { const: 1 }
        kind: { const: transfer }
        payee:
          type: object
          additionalProperties: false
          required: [id, name, first_payment]
          properties:
            id: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$" }
            name: { type: string, minLength: 1, maxLength: 80 }
            first_payment: { type: boolean, description: "True when the payer has never paid this payee. Second Key also checks its own payee history, which can only make this stricter." }
            email: { type: string, format: email, description: "If set, an approved and captured transfer is paid out here, and only here" }
        amount_cents: { type: integer, minimum: 1, maximum: 10000000 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        purpose: { type: string, maxLength: 200 }
        review_threshold_cents: { type: integer, description: "The payer's rule set in advance: first payments to someone new at or above this get a second look. The stricter of this and the standing profile applies." }
        expires_at: { type: string, format: date-time }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [kind, intent_id, payee_id, amount_cents, currency]
      properties:
        kind: { const: transfer }
        intent_id: { type: string }
        payee_id: { type: string, description: "Must match the confirmed payee" }
        amount_cents: { type: integer, minimum: 1, maximum: 10000000, description: "Must match the confirmed amount exactly" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        conversation: { $ref: "#/components/schemas/PurchaseRequest/properties/conversation" }
    PurchaseStatus:
      type: object
      properties:
        id: { type: string }
        state:
          type: string
          enum: [SCREENING, REJECTED, AUTHORIZING, AUTH_FAILED, VERIFYING, HELD, CAPTURE_APPROVED, CAPTURING, CAPTURE_PENDING, NEEDS_RECONCILE, CAPTURED, CAPTURE_DECLINED, VOIDING, VOIDED, DISPUTED, DISPUTE_RESOLVED, REFUNDED]
        outcome: { type: string, enum: [REJECT, HOLD, CAPTURE, VOID] }
        reasons: { type: array, items: { type: string }, description: "Each failing or pausing check, as check_id: detail" }
        intent_id: { type: string }
        retailer: { type: string }
        amount: { type: object, properties: { currency_code: { type: string }, value: { type: string } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example:
        id: pur_YKv0a0drZieikLZb
        state: CAPTURED
        outcome: CAPTURE
        reasons: []
        intent_id: int_SN6HRr14lVI0xBIV
        retailer: rei.com
        amount: { currency_code: USD, value: "84.00" }
    Evidence:
      type: object
      properties:
        purchase: { $ref: "#/components/schemas/PurchaseStatus" }
        intent: { $ref: "#/components/schemas/Intent" }
        facts: { type: array, items: { type: object } }
        checks:
          type: array
          items:
            type: object
            properties:
              phase: { type: string }
              check_id: { type: string }
              kind: { type: string, enum: [deterministic, ai] }
              result: { type: string, enum: [pass, fail, unknown] }
              detail: { type: string }
              model: { type: string }
              prompt_version: { type: string }
        chain: { $ref: "#/components/schemas/ChainProof" }
    ChainProof:
      type: object
      properties:
        epoch: { type: integer }
        valid: { type: boolean }
        head_hash: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              event_type: { type: string }
              prev_hash: { type: string }
              hash: { type: string }
              at: { type: string, format: date-time }
